# webfrontend CI. This repo had no workflow at all, which made it the one repo where ADR-0031's
# `main-integrity` ruleset could enforce PR-only, no-force-push and no-deletion but had no required
# check to enforce — the gap ADR-0031 recorded as a follow-up. `ci-gates.md` says what this repo
# should eventually gate (lint/format, contract schema, unit, E2E, boundary/arch, version floors);
# what is wired here is everything that exists today, and the header of each step says which.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Job name is the required-status-check context in `main-integrity` — renaming it silently
    # unrequires the gate, so keep it in step with scripts/apply-rulesets.sh in the super-repo.
    name: build + typecheck + test + arch gates
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the ceremony gate below can diff against the base branch. With the
      # default depth of 1 there is no merge base and the gate exits 3 rather than passing
      # quietly — a shallow clone is exactly the case SPEC-0012 AC6 refuses to wave through.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same node24 bump as the super-repo gate: v4 of both actions declares node20 in its
      # action.yml, so the runner was force-running them on node24 and annotating every run.
      # `cache: npm` stays explicit — the newer majors can infer the manager from a
      # `packageManager` field in package.json, and this repo does not declare one. The key comes
      # off the root package-lock.json, which exists, so this is a cache that actually restores.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: install
        run: npm ci

      # ADR-0023 floors: Node >= 26, TypeScript >= 7. The super-repo checks the *declared* floors
      # across submodules; this checks what CI actually resolved, which is the number that matters.
      - name: version floors (ADR-0023)
        run: |
          node_major=$(node -p 'process.versions.node.split(".")[0]')
          [ "$node_major" -ge 26 ] || { echo "node $node_major < floor 26 (ADR-0023)"; exit 1; }
          ts_major=$(node -p 'require("typescript").version.split(".")[0]')
          [ "$ts_major" -ge 7 ] || { echo "typescript $ts_major < floor 7 (ADR-0023)"; exit 1; }
          echo "floors: node $node_major, tsc $ts_major"

      # Invariant 22 + ADR-0025: no other repo's source, no infra clients, src/gen stays generated.
      # Linted before it is trusted, same as the super-repo's fitness scripts (T-0009).
      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: boundary gates
        run: ./scripts/check-boundaries.sh

      - name: typecheck
        run: npm run check

      - name: unit tests
        run: npm test

      - name: build
        run: npm run build

      # Not wired yet, and deliberately not faked with a passing no-op step:
      #  - lint/format: no ESLint/Prettier in this repo yet.
      #  - E2E: no Playwright yet (AGENTS.md wants a few on critical paths).
      #  - contract codegen freshness (`npm run gen` + `git diff --exit-code src/gen`): buf.gen.yaml
      #    reads ../governance/contracts, a sibling checkout that does not exist in a standalone CI
      #    run. Needs the generated-type publishing follow-up in ADR-0027/0028 first.

      # SPEC-0012: the ceremony tier a PR declares must match what its diff does. Only meaningful
      # on a pull request — a push to main carries no declaration, and inventing one is not the
      # gate's business. The script is generated from governance canonical/agent-surfaces/
      # (ADR-0037); never hand-edit it, and `make surfaces-check` in the composition fails on drift.
      - name: ceremony tier
        if: github.event_name == 'pull_request'
        run: ./scripts/check-ceremony-tier.sh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CEREMONY_BASE: origin/${{ github.base_ref }}

      # SPEC-0013: the pre-commit scope hook is skipped by --no-verify, so the boundary only binds
      # if CI checks the pushed diff too. Invariant 23 is asserted unconditionally here — the
      # ceremony gate above only reaches its span check under the `bugfix` tier, which left a
      # `full`-tier PR spanning two submodules unchecked. The path half is opt-in via a `Scope:`
      # line in the PR body and says so when absent.
      - name: dispatch scope
        if: github.event_name == 'pull_request'
        run: ./scripts/check-dispatch-scope.sh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          SCOPE_BASE: origin/${{ github.base_ref }}

      # SPEC-0014 AC8: the flag audit binds on the Linux lane too, so a contributor with no Mac finds
      # a GNU-only construct here rather than on the macOS one. The userland assertion does not apply
      # on this OS and the gate says so on its own output line rather than passing silently.
      - name: shell portability audit
        run: ./scripts/check-shell-portability.sh

  # SPEC-0014, T-0003 AC4. "Works on macOS and Linux" had never been run on macOS; what stood in for
  # it was a bash:3.2 container that is Alpine plus busybox, with no lineage to Darwin. This is the
  # real thing, and it is free because the repo is public.
  #
  # A SEPARATE JOB, WHICH MEANS A SEPARATE REQUIRED-CHECK CONTEXT. This job's name is registered
  # alongside the one above by the super-repo's scripts/apply-rulesets.sh; until `make
  # rulesets-apply` runs, this lane reports and does not block. Named here rather than found later.
  portability:
    name: macOS portability
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Part 3 of the gate asserts the bash and the userland before anything else runs, so a runner
      # image that put Homebrew's GNU coreutils ahead of /usr/bin fails loudly here instead of
      # quietly turning this lane into a second Linux one.
      - name: shell portability gate
        run: ./scripts/check-shell-portability.sh

      # The one existing shell gate this repo owns. Parsing proves no bash-4 syntax; running it
      # against a BSD userland is the half the container could never prove.
      - name: boundary gates on BSD
        run: ./scripts/check-boundaries.sh
